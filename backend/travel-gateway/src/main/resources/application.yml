server:
  port: 9000

# JWT 配置
jwt:
  secret: HPJigY187DIyTDySldz1rCJSfZTe2H+Hr8cFc8G7yqc=
  white-list:
    - /auth/**
    - /public/**
    - /actuator/**
    - /swagger-ui/**
    - /v3/api-docs/**
  logout-path: /auth/logout

logging:
  level:
    com.alibaba.nacos: ERROR
    org.springframework.cloud.client.discovery: ERROR

front-end:
  allowedOrigins: http://localhost:5173,http://localhost:5174

management:
  endpoints:
    web:
      exposure:
        include: gateway,health,info   # 暴露 gateway 端点
  endpoint:
    gateway:
      enabled: true                     # 确保 gateway 端点启用